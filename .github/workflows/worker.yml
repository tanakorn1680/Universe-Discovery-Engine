name: discovery-worker

on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "เวลาที่ให้ worker ทำงานต่อโจทย์ (วินาที)"
        default: "1200"
  schedule:
    - cron: "17 */6 * * *"

# กัน worker สองตัวเขียน log พร้อมกัน (log เป็น single-writer)
concurrency:
  group: discovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: รันทุกโจทย์ (verify -> plan -> work -> analyze -> verify)
        run: |
          for m in ising potts3 pca; do
            echo "=== mission: $m"
            export DE_MISSION=$m
            python engine.py verify
            python engine.py plan
            python engine.py work --reclaim --budget-seconds "${{ inputs.budget_seconds || 1200 }}"
            python engine.py analyze
            python engine.py verify
          done
      - name: บันทึกผลกลับเข้า repo (ถ้ามีคอมมิตอื่นเข้ามาก่อน จะดึงมาต่อแล้วลองใหม่)
        run: |
          git config user.name "discovery-bot"
          git config user.email "discovery-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "worker run $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i), rebasing onto remote"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; }
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts"
          exit 1
