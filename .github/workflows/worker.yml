name: discovery-worker

on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "เวลาที่ให้ worker ทำงาน (วินาที)"
        default: "1500"
  schedule:
    - cron: "17 */6 * * *"

# กัน worker สองตัวเขียน log พร้อมกัน (log เป็น single-writer)
concurrency:
  group: discovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: ตรวจ hash chain ก่อนทำงาน
        run: python engine.py verify
      - name: เลือกการทดลองถัดไป
        run: python engine.py plan
      - name: รัน jobs (resume ได้ ถ้ารอบก่อนถูกตัดกลางคัน)
        run: python engine.py work --reclaim --budget-seconds "${{ inputs.budget_seconds || 1500 }}"
      - name: วิเคราะห์และเขียนรายงาน
        run: python engine.py analyze
      - name: ตรวจอีกครั้งแล้วบันทึกผลกลับเข้า repo
        run: |
          python engine.py verify
          git config user.name "discovery-bot"
          git config user.email "discovery-bot@users.noreply.github.com"
          git add state report.md
          git diff --cached --quiet || git commit -m "worker run $(date -u +%FT%TZ)"
          git push
